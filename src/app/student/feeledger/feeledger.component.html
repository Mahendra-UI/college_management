<section class="common_section">
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <div class="main_heading">
                  <h5>Fee Ledgers</h5>
                </div>
            </div>
            <div class="col-md-6">
                <div class="common_home_icon">
                    <i class="bi bi-house-door" routerLink="/student/home"></i>
                </div>
            </div>
            <hr>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="table-responsive">
                    <table class="table table-bordered w-100 common_table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Fee Type</th>
                                <th>Course</th>
                                <th>Semester</th>
                                <th>Year</th>
                                <th>Fee Amount</th>
                                <th>Fee Description</th>
                                <!-- <th>Created At</th>
                                <th>Updated At</th> -->
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let record of feeLedersList; let i = index;">
                                <td>{{ i+1 }}</td>
                                <td>{{ record.fee_type_name }}</td>
                                <td>{{ record.course_name }}</td>
                                <td>{{ record.semester_name }}</td>
                                <td>{{ record.year }}</td>
                                <td>{{ record.fee_amount }}</td>
                                <td>{{ record.fee_ledger_description }}</td>
                                <!-- <td>{{ record.created_at | date: 'short' }}</td>
                                <td>{{ record.updated_at | date: 'short' }}</td> -->
                            </tr>
                            <tr *ngIf="feeLedersList.length === 0">
                                <td colspan="7" class="text-center">No Records Found</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
