  <div class="container">
    <div class="row">
      <div class="col-md-4"></div>
      <div class="col-md-4">
        <div class="d-flex justify-content-center align-items-center vh-100" data-aos="fade-down" data-aos-delay="400">
          <div class="row mx-auto my-auto bg-white p-3 rounded-3 shadow w-30" [formGroup]="loginForm">
            <img src="IIT_Bhubaneswar_Logo.png" alt="image" class="img-fluid mb-3">
            <!-- <div class="col-md-12 bg-white p-3 rounded-3 shadow" [formGroup]="loginForm"> -->
              <!-- <h2 class="text-center mb-4">Login</h2> -->
              <form>
                <div class="form-group mb-3">
                  <label for="userType" class="form-label">Select Type <span class="mandatory">*</span></label>
                  <select class="form-select" id="userType" formControlName="userType" (change)="userChange($event)">
                    <option value="" selected disabled>--Select--</option>
                    <option value="1">Student</option>
                    <option value="2">Admin</option>
                  </select>
                  <div class="text-danger" *ngIf="loginFormCtrl('userType')?.invalid && loginFormCtrl('userType')?.touched">Type is required</div>
                </div>
                <div class="form-group mb-3">
                  <label for="userName" class="form-label">User Name <span class="mandatory">*</span></label>
                  <input type="text" class="form-control" id="userName" formControlName="userName">
                  <div class="text-danger" *ngIf="loginFormCtrl('userName')?.invalid && loginFormCtrl('userName')?.touched">User Name is required</div>
                </div>
                <div class="form-group mb-3">
                  <label for="enterPassword" class="form-label">Password <span class="mandatory">*</span></label>
                  <input type="password" class="form-control" id="enterPassword" formControlName="enterPassword">
                  <div class="text-danger" *ngIf="loginFormCtrl('enterPassword')?.invalid && loginFormCtrl('enterPassword')?.touched">Password is required</div>
                </div>
                <div class="form-group mb-3">
                  <button class="btn btn-success btn-md fs-5 w-100" [disabled]="loginForm.invalid" (click)="onSubmit()">Submit</button>
                </div>
              </form>
          </div>
      </div>
      </div>
      <div class="col-md-4"></div>
    </div>
  </div>
  
  </section>
