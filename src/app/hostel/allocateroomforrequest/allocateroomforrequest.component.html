<section class="common_section">
    <div class="container">
      <div class="row">
        <div class="col-md-6">
          <h5>Allocate Rooms for Approved Requests</h5>
        </div>
        <hr>
      </div>
  
      <div class="row">
        <div class="col-md-12">
          <div class="table-responsive">
            <table class="table table-bordered">
              <thead class="table-dark">
                <tr>
                  <th>Request ID</th>
                  <th>Username</th>
                  <th>Academic Year</th>
                  <th>Status</th>
                  <th>Requested At</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let request of roomRequests">
                  <td>{{ request.request_id }}</td>
                  <td>{{ request.username }}</td>
                  <td>{{ request.academic_course_year_id }}</td>
                  <td>
                    <span [ngClass]="{'text-success': request.status === 'Approved', 'text-warning': request.status === 'Pending', 'text-danger': request.status === 'Rejected'}">
                        {{ request.status }}
                      </span>
                    <!-- <span class="badge"
                      [ngClass]="{
                        'bg-success': request.status === 'Approved',
                        'bg-warning': request.status === 'Pending',
                        'bg-danger': request.status === 'Rejected',
                      }">
                      {{ request.status }}
                    </span> -->
                  </td>
                  <td>{{ request.requested_at | date: 'short' }}</td>
                  <td>
                    <!-- Bootstrap 5 Modal Trigger (No TypeScript Needed) -->
                    <button class="btn btn-primary btn-sm"
                    data-bs-toggle="modal"
                    data-bs-target="#actionModal"
                    (click)="openActionModal(request.request_id)">
                    Take Action
                  </button>                  
                  </td>
                </tr>
                <tr *ngIf="roomRequests.length === 0">
                  <td colspan="6" class="text-center">No Requests Found</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  
    <!-- Bootstrap 5 Modal for Room Allocation -->
    <div class="modal fade" id="actionModal" tabindex="-1" aria-labelledby="actionModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="actionModalLabel">Allocate Room</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form [formGroup]="allocateRoomForm" (ngSubmit)="allocateRoom()">
              <div class="mb-3">
                <label class="form-label">Select Hostel</label>
                <select class="form-control" formControlName="hostel_id" (change)="getBlocks(); checkFormValidity()">
                <!-- <select class="form-control" formControlName="hostel_id" (change)="getBlocks()"> -->
                  <option value="">-- Select Hostel --</option>
                  <option *ngFor="let hostel of hostels" [value]="hostel.hostel_id">
                    {{ hostel.hostel_name }}
                  </option>
                </select>
              </div>
  
              <div class="mb-3">
                <label class="form-label">Select Block</label>
                <select class="form-control" formControlName="block_id" (change)="getFloors(); checkFormValidity()">
                <!-- <select class="form-control" formControlName="block_id" (change)="getFloors()"> -->
                  <option value="">-- Select Block --</option>
                  <option *ngFor="let block of blocks" [value]="block.block_id">
                    {{ block.block_name }}
                  </option>
                </select>
              </div>
  
              <div class="mb-3">
                <label class="form-label">Select Floor</label>
                <select class="form-control" formControlName="floor_id" (change)="getRooms(); checkFormValidity()">
                <!-- <select class="form-control" formControlName="floor_id" (change)="getRooms()"> -->
                  <option value="">-- Select Floor --</option>
                  <option *ngFor="let floor of floors" [value]="floor.floor_id">
                    {{ floor.floor_name }}
                  </option>
                </select>
              </div>
  
              <div class="mb-3">
                <label class="form-label">Select Room</label>
                <select class="form-control" formControlName="room_id" (change)="checkFormValidity()">
                <!-- <select class="form-control" formControlName="room_id"> -->
                  <option value="">-- Select Room --</option>
                  <option *ngFor="let room of rooms" [value]="room.room_id">
                    {{ room.room_name }} (Seats: {{ room.total_seats }} | Available: {{ room.available_seats }})
                  </option>
                </select>
              </div>
  
              <div class="mb-3">
                <button type="submit" class="btn btn-primary w-100"
                [disabled]="isLoading || allocateRoomForm.invalid"
                (click)="debugFormValidity()">
                <span *ngIf="!isLoading">Allocate Room</span>
                <span *ngIf="isLoading">
                  <i class="fa fa-spinner fa-spin"></i> Processing...
                </span>
              </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
