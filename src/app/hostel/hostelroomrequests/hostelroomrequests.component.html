<!-- Room Requests Table -->
<div class="container mt-4">
    <h4>Room Requests</h4>
    <div class="table-responsive">
      <table class="table table-bordered">
        <thead class="table-dark">
          <tr>
            <th>Request ID</th>
            <th>Username</th>
            <th>Academic Year</th>
            <th>Status</th>
            <th>Requested At</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let request of roomRequests">
            <td>{{ request.request_id }}</td>
            <td>{{ request.username }}</td>
            <td>{{ request.academic_course_year_id }}</td>
            <td>
              <span class="badge"
                [ngClass]="{
                  'bg-success': request.status === 'Approved',
                  'bg-warning': request.status === 'Pending',
                  'bg-danger': request.status === 'Rejected'
                }">
                {{ request.status }}
              </span>
            </td>
            <td>{{ request.requested_at | date: 'short' }}</td>
            <td>
              <!-- Bootstrap 5 Modal Trigger (No TypeScript Needed) -->
              <button class="btn btn-primary btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#actionModal"
                (click)="selectedRequest = request">
                Take Action
              </button>
            </td>
          </tr>
          <tr *ngIf="roomRequests.length === 0">
            <td colspan="6" class="text-center">No Requests Found</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  
  <!-- Bootstrap 5 Modal for Approving/Rejecting Requests -->
  <div class="modal fade" id="actionModal" tabindex="-1" aria-labelledby="actionModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="actionModalLabel">Approve/Reject Room Request</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form [formGroup]="actionForm" (ngSubmit)="submitAction()">
            <div class="mb-3">
              <label class="form-label">Select Action</label>
              <select class="form-control" formControlName="status">
                <option value="">-- Select Action --</option>
                <option value="Approved">Approve</option>
                <option value="Rejected">Reject</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Remarks</label>
              <textarea class="form-control" rows="3" formControlName="remarks" placeholder="Enter remarks"></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading || actionForm.invalid">
              <span *ngIf="!isLoading">Submit</span>
              <span *ngIf="isLoading">
                <i class="fa fa-spinner fa-spin"></i> Processing...
              </span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
